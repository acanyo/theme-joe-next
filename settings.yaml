apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-joe-next-setting
spec:
  forms:
    - group: general
      label: 基础
      formSchema:
        - $formkit: select
          name: color_mode
          id: color_mode
          key: color_mode
          label: 颜色模式
          value: user
          help: 用户模式：访客可在页面上切换明暗；自动模式：按下方时间段切换；浅色 / 暗黑：固定不变
          options:
            - value: user
              label: 访客切换
            - value: auto
              label: 按时段自动
            - value: light
              label: 始终浅色
            - value: dark
              label: 始终暗黑
        - $formkit: text
          name: light_hours
          id: light_hours
          key: light_hours
          label: 浅色时段
          value: 5:00~19:00
          help: 仅自动模式生效，格式 5:00~19:00，时段外为暗黑模式
        - $formkit: number
          name: content_width
          id: content_width
          key: content_width
          label: 内容最大宽度
          value: 1320
          help: 单位 px，默认 1320
        - $formkit: attachment
          name: favicon
          id: favicon
          key: favicon
          label: 网站图标
          value: ""
          help: 覆盖 Halo 的站点图标，建议 64×64 的 png
        - $formkit: select
          name: link_target
          id: link_target
          key: link_target
          label: 链接打开方式
          value: default
          help: 默认：文章正文和瞬间里的链接在新标签打开；当前页 / 新标签：内容区域（不含导航栏与页脚）的所有链接统一按此打开
          options:
            - value: default
              label: 默认
            - value: current
              label: 当前页
            - value: new
              label: 新标签
        - $formkit: switch
          name: back_to_top
          id: back_to_top
          key: back_to_top
          label: 返回顶部按钮
          value: false
        - $formkit: switch
          name: back_to_top_smooth
          id: back_to_top_smooth
          key: back_to_top_smooth
          label: 平滑滚动到顶部
          value: false
    - group: appearance
      label: 外观
      formSchema:
        - $formkit: color
          name: accent_light
          id: accent_light
          key: accent_light
          label: 主题色（浅色）
          value: "#fb6c28"
          help: "默认 #fb6c28"
        - $formkit: color
          name: accent_dark
          id: accent_dark
          key: accent_dark
          label: 主题色（暗黑）
          value: "#9999ff"
          help: "默认 #9999ff"
        - $formkit: switch
          value: false
          name: background_light_enabled
          id: background_light_enabled
          key: background_light_enabled
          label: 浅色背景图
        - $formkit: attachment
          if: $get(background_light_enabled).value == true
          name: background_light
          id: background_light
          key: background_light
          label: 浅色背景图地址
          help: 建议 webp 格式
          value: ""
        - $formkit: switch
          value: false
          name: background_dark_enabled
          id: background_dark_enabled
          key: background_dark_enabled
          label: 暗黑背景图
        - $formkit: attachment
          if: $get(background_dark_enabled).value == true
          name: background_dark
          id: background_dark
          key: background_dark
          label: 暗黑背景图地址
          help: 建议 webp 格式
          value: ""
        - $formkit: select
          name: font
          id: font
          key: font
          label: 网站字体
          value: off
          help: 填写了自定义字体时以自定义字体为准
          options:
            - value: off
              label: 默认
            - value: joe_slate.woff2
              label: Joe Slate
            - value: joe_future.woff2
              label: Joe Future
        - $formkit: attachment
          name: custom_font
          id: custom_font
          key: custom_font
          label: 自定义字体
          value: ""
          help: 字体文件地址，建议 woff2
        - $formkit: text
          name: iconfont
          id: iconfont
          key: iconfont
          label: iconfont 图标库
          value: ""
          help: iconfont 生成的 CSS 链接，会插入 head 末尾
        - $formkit: color
          name: scrollbar_color
          id: scrollbar_color
          key: scrollbar_color
          label: 滚动条颜色
          value: "#fb6c28"
        - $formkit: text
          name: scrollbar_width
          id: scrollbar_width
          key: scrollbar_width
          label: 滚动条宽度
          value: 8px
          help: 默认 8px，填 0 隐藏
        - $formkit: switch
          name: grayscale
          id: grayscale
          key: grayscale
          label: 全站灰色
          value: false
          help: 用于哀悼日等场景
    - group: effects
      label: 动效
      formSchema:
        - $formkit: select
          name: page_transition
          id: page_transition
          key: page_transition
          label: 页面切换方式
          value: native
          help: 原生过渡：浏览器自带的跨页面淡入淡出，仍是整页加载，最稳定（Chrome / Edge / Safari 18+ 生效，其他浏览器无影响）。无刷新切换（swup）：只替换内容区域，切换更快、页面不闪白，并预加载链接；如遇插件兼容问题可切回原生过渡。
          options:
            - value: none
              label: 关闭
            - value: native
              label: 原生过渡（推荐）
            - value: swup
              label: 无刷新切换（swup）
        - $formkit: switch
          name: swup_preload
          id: swup_preload
          key: swup_preload
          label: 预加载链接
          value: true
          if: $get(page_transition).value === 'swup'
          help: 鼠标悬停或触摸链接时提前请求页面，点击后几乎立即切换
        - $formkit: switch
          value: false
          name: loading_bar
          id: loading_bar
          key: loading_bar
          label: 页面加载条
          help: 页面顶部的加载进度条
        - $formkit: text
          if: $get(loading_bar).value
          name: loading_bar_height
          id: loading_bar_height
          key: loading_bar_height
          label: 加载条高度
          value: 3px
          help: 默认 3px
        - $formkit: color
          if: $get(loading_bar).value
          name: loading_bar_color
          id: loading_bar_color
          key: loading_bar_color
          label: 加载条颜色
          value: "#fb6c28"
          help: 留空使用主题色
        - $formkit: switch
          name: reveal
          id: reveal
          key: reveal
          label: 模块缓入动画
          help: 页面载入时模块依次淡入
          value: false
        - $formkit: select
          name: cursor_skin
          id: cursor_skin
          key: cursor_skin
          label: 鼠标皮肤
          value: off
          help: 部分皮肤在暗黑模式下不明显；绿色模式下不生效
          options:
            - value: off
              label: 无
            - value: simple_cursor
              label: 简洁卡通
            - value: simple_cursor_blue
              label: 简洁卡通-蓝
            - value: simple_sunset_light
              label: 简单日落(浅色)
            - value: simple_sunset_dark
              label: 简单日落(暗黑)
            - value: crystallize
              label: 简约水晶
            - value: emoji_zip
              label: 魔力表情
            - value: black_cat
              label: 小黑猫
        - $formkit: select
          name: cursor_effect
          id: cursor_effect
          key: cursor_effect
          label: 鼠标点击特效
          value: off
          help: 移动端与绿色模式下不生效
          options:
            - value: off
              label: 无（默认）
            - value: cursor0
              label: 樱花+颜文字
            - value: cursor1
              label: 小粒子
            - value: cursor2
              label: 大粒子
            - value: cursor3
              label: 社会主义价值观
            - value: cursor4
              label: 大爱心
            - value: cursor5
              label: 小爱心+颜文字
            - value: cursor6
              label: 多彩星星（移动）
            - value: cursor7
              label: 光标残影（移动）
            - value: cursor8
              label: 弹性表情（移动）
            - value: cursor9
              label: 表情雨（移动）
            - value: cursor10
              label: 上升气泡（移动）
            - value: cursor11
              label: 雪花雨（移动）
        - $formkit: select
          name: backdrop
          id: backdrop
          key: backdrop
          label: 背景特效
          value: off
          help: 部分特效显示在页面最上层，部分仅在暗黑模式生效；较耗性能，移动端与绿色模式下不加载
          options:
            - value: off
              label: 无
            - value: universe
              label: 宇宙空间（仅暗黑）
            - value: rain
              label: 粒子雨（顶层+仅暗黑）
            - value: plexus
              label: 自动吸附的线段
            - value: petals
              label: 飘落的花瓣（顶层）
            - value: rainbow
              label: 四色彩虹
            - value: silk
              label: 变化的彩带
            - value: silk_static
              label: 固定的彩带
            - value: balloon
              label: 上升的气球
        - $formkit: switch
          value: false
          name: offscreen_title
          id: offscreen_title
          key: offscreen_title
          label: 离开页面时修改标题
          help: 仅首页生效
        - $formkit: text
          name: offscreen_title_leave
          id: offscreen_title_leave
          key: offscreen_title_leave
          if: $get(offscreen_title).value
          label: 离开时的标题
          value: 歪，你去哪里了？
        - $formkit: text
          name: offscreen_title_back
          id: offscreen_title_back
          key: offscreen_title_back
          if: $get(offscreen_title).value
          label: 回来时的标题
          value: (つェ⊂)咦，又回来了!
    - group: navbar
      label: 导航栏
      formSchema:
        - $formkit: menuSelect
          name: menu
          id: menu
          key: menu
          label: 导航菜单
          value: ""
          help: 留空使用 Halo 的主菜单
        - $formkit: switch
          name: sticky
          id: sticky
          key: sticky
          label: 吸顶
          help: 向上滚动时显示导航栏；移动端始终吸顶
          value: false
        - $formkit: switch
          name: full_width
          id: full_width
          key: full_width
          label: 通栏宽度
          help: 关闭时与内容区同宽
          value: false
        - $formkit: switch
          name: glass
          id: glass
          key: glass
          label: 毛玻璃背景
          help: 仅吸顶时生效
          value: false
        - $formkit: switch
          name: logo
          id: logo
          key: logo
          label: 显示 Logo
          help: 使用 Halo 站点设置中的 Logo
          value: false
        - $formkit: text
          name: logo_link
          id: logo_link
          key: logo_link
          label: Logo 链接
          value: ""
          help: "留空回到首页，填 # 不跳转"
        - $formkit: text
          name: logo_radius
          id: logo_radius
          key: logo_radius
          label: Logo 圆角
          value: 4px
          help: 像素或百分比，默认 4px
        - $formkit: switch
          name: icons
          id: icons
          key: icons
          label: 菜单图标
          help: 显示菜单项在后台配置的图标
          value: false
        - $formkit: switch
          name: icon_animation
          id: icon_animation
          key: icon_animation
          label: 菜单图标悬停动画
          value: false
        - $formkit: switch
          name: active_glow
          id: active_glow
          key: active_glow
          label: 当前项发光
          help: 当前菜单项文字加主题色光晕
          value: false
        - $formkit: switch
          name: login
          id: login
          key: login
          label: 登录入口
          value: false
          help: 未登录显示登录按钮，已登录显示头像
    - group: home
      label: 首页
      formSchema:
        - $formkit: radio
          name: load_more
          id: load_more
          key: load_more
          label: 文章分页方式
          value: false
          options:
            - value: true
              label: 加载更多
            - value: false
              label: 分页
        - $formkit: switch
          name: infinite_scroll
          id: infinite_scroll
          key: infinite_scroll
          label: 滚动到底自动加载
          help: 仅「加载更多」方式生效
          value: false
        - $formkit: switch
          name: thumbnail
          id: thumbnail
          key: thumbnail
          label: 文章缩略图
          value: false
        - $formkit: attachment
          name: default_thumbnail
          id: default_thumbnail
          key: default_thumbnail
          label: 默认缩略图
          value: https://picsum.photos/id/1081/350/200
          help: 文章没有封面时使用，留空则尝试随机图
        - $formkit: attachment
          name: fallback_thumbnail
          id: fallback_thumbnail
          key: fallback_thumbnail
          label: 缩略图加载失败时
          value: /themes/theme-joe-next/assets/images/default_thumbnail.png
          help: 图片加载出错时显示的图片
        - $formkit: switch
          value: false
          name: random_thumbnail
          id: random_thumbnail
          key: random_thumbnail
          label: 随机缩略图
          help: 没有封面也没有默认缩略图时，使用随机图接口
        - $formkit: text
          if: $get(random_thumbnail).value == true
          name: random_thumbnail_api
          id: random_thumbnail_api
          key: random_thumbnail_api
          value: https://imgapi.xl0408.top/index.php
          label: 随机图接口
        - $formkit: switch
          value: false
          name: list_animation
          id: list_animation
          key: list_animation
          label: 列表动画
        - $formkit: select
          name: list_animation_name
          id: list_animation_name
          key: list_animation_name
          label: 列表动画效果
          value: fadeInUp
          help: animate.css 动画名
          options:
            - value: fadeIn
              label: fadeIn
            - value: fadeInUp
              label: fadeInUp
            - value: fadeInDown
              label: fadeInDown
            - value: fadeInDownBig
              label: fadeInDownBig
            - value: fadeInLeft
              label: fadeInLeft
            - value: fadeInLeftBig
              label: fadeInLeftBig
            - value: fadeInRight
              label: fadeInRight
            - value: fadeInRightBig
              label: fadeInRightBig
            - value: fadeInUpBig
              label: fadeInUpBig
            - value: fadeOut
              label: fadeOut
            - value: fadeOutDown
              label: fadeOutDown
            - value: fadeOutDownBig
              label: fadeOutDownBig
            - value: fadeOutLeft
              label: fadeOutLeft
            - value: fadeOutLeftBig
              label: fadeOutLeftBig
            - value: fadeOutRight
              label: fadeOutRight
            - value: fadeOutRightBig
              label: fadeOutRightBig
            - value: fadeOutUp
              label: fadeOutUp
            - value: fadeOutUpBig
              label: fadeOutUpBig
            - value: bounce
              label: bounce
            - value: flash
              label: flash
            - value: pulse
              label: pulse
            - value: rubberBand
              label: rubberBand
            - value: headShake
              label: headShake
            - value: swing
              label: swing
            - value: tada
              label: tada
            - value: wobble
              label: wobble
            - value: jello
              label: jello
            - value: heartBeat
              label: heartBeat
            - value: bounceIn
              label: bounceIn
            - value: bounceInDown
              label: bounceInDown
            - value: bounceInLeft
              label: bounceInLeft
            - value: bounceInRight
              label: bounceInRight
            - value: bounceInUp
              label: bounceInUp
            - value: bounceOut
              label: bounceOut
            - value: bounceOutDown
              label: bounceOutDown
            - value: bounceOutLeft
              label: bounceOutLeft
            - value: bounceOutRight
              label: bounceOutRight
            - value: bounceOutUp
              label: bounceOutUp
            - value: flip
              label: flip
            - value: flipInX
              label: flipInX
            - value: flipInY
              label: flipInY
            - value: flipOutX
              label: flipOutX
            - value: flipOutY
              label: flipOutY
            - value: rotateIn
              label: rotateIn
            - value: rotateInDownLeft
              label: rotateInDownLeft
            - value: rotateInDownRight
              label: rotateInDownRight
            - value: rotateInUpLeft
              label: rotateInUpLeft
            - value: rotateInUpRight
              label: rotateInUpRight
            - value: rotateOut
              label: rotateOut
            - value: rotateOutDownLeft
              label: rotateOutDownLeft
            - value: rotateOutDownRight
              label: rotateOutDownRight
            - value: rotateOutUpLeft
              label: rotateOutUpLeft
            - value: rotateOutUpRight
              label: rotateOutUpRight
            - value: hinge
              label: hinge
            - value: jackInTheBox
              label: jackInTheBox
            - value: rollIn
              label: rollIn
            - value: rollOut
              label: rollOut
            - value: zoomIn
              label: zoomIn
            - value: zoomInDown
              label: zoomInDown
            - value: zoomInLeft
              label: zoomInLeft
            - value: zoomInRight
              label: zoomInRight
            - value: zoomInUp
              label: zoomInUp
            - value: zoomOut
              label: zoomOut
            - value: zoomOutDown
              label: zoomOutDown
            - value: zoomOutLeft
              label: zoomOutLeft
            - value: zoomOutRight
              label: zoomOutRight
            - value: zoomOutUp
              label: zoomOutUp
            - value: slideInDown
              label: slideInDown
            - value: slideInLeft
              label: slideInLeft
            - value: slideInRight
              label: slideInRight
            - value: slideInUp
              label: slideInUp
            - value: slideOutDown
              label: slideOutDown
            - value: slideOutLeft
              label: slideOutLeft
            - value: slideOutRight
              label: slideOutRight
            - value: slideOutUp
              label: slideOutUp
        - $formkit: switch
          value: false
          name: featured
          id: featured
          key: featured
          label: 精选分类
          help: 首页顶部的精选分类卡片
        - $formkit: repeater
          name: featured_items
          id: featured_items
          key: featured_items
          if: $get(featured).value
          max: 4
          min: 1
          label: 精选分类内容
          value: []
          children:
            - $formkit: radio
              name: source
              id: source
              key: source
              label: 来源
              value: ""
              options:
                - label: 分类
                  value: category
                - label: 自定义
                  value: custom
            - $formkit: group
              name: category
              id: category
              key: category
              if: $value.source === 'category'
              label: 分类
              value: ""
              children:
                - $formkit: categorySelect
                  name: name
                  id: name
                  key: name
                  label: 选择分类
                  value: ""
                  validation: required
            - $formkit: group
              name: custom
              id: custom
              key: custom
              if: $value.source === 'custom'
              label: 自定义
              value: []
              children:
                - $formkit: text
                  name: title
                  id: title
                  key: title
                  label: 标题
                  value: ""
                  validation: required
                - $formkit: url
                  name: url
                  id: url
                  key: url
                  label: 链接
                  value: ""
                  validation: required
                - $formkit: attachment
                  name: image
                  id: image
                  key: image
                  label: 图片
                  value: ""
                  validation: required
        - $formkit: textarea
          name: qq_group
          id: qq_group
          key: qq_group
          label: QQ 群链接
          value: ""
          help: 留空不显示
        - $formkit: textarea
          name: qq_group_text
          id: qq_group_text
          key: qq_group_text
          label: QQ 群按钮文字
          value: 欢迎加入QQ交流群
    - group: hero
      label: 首页大图
      formSchema:
        - $formkit: switch
          value: false
          name: enabled
          id: enabled
          key: enabled
          label: 首页大图
          help: 首页顶部全宽的大图区域
        - $formkit: text
          name: title
          id: title
          key: title
          if: $get(enabled).value === true
          label: 标题
          value: null
          help: 留空使用站点标题
        - $formkit: text
          name: image
          id: image
          key: image
          if: $get(enabled).value === true
          label: 图片
          value: http://imgapi.xl0408.top/index.php
          help: 图片地址或随机图接口
        - $formkit: switch
          value: false
          name: hitokoto
          id: hitokoto
          key: hitokoto
          if: $get(enabled).value === true
          label: 一言
          help: 标题下方显示随机一句话
        - $formkit: switch
          value: false
          name: video_enabled
          id: video_enabled
          key: video_enabled
          if: $get(enabled).value === true
          label: 视频背景
        - $formkit: attachment
          name: video
          id: video
          key: video
          if: $get(video_enabled).value === true
          label: 视频地址
          value: null
        - $formkit: text
          name: wave_light
          id: wave_light
          key: wave_light
          if: $get(enabled).value === true
          label: 底部波浪颜色（浅色）
          value: "#fff"
        - $formkit: text
          name: wave_dark
          id: wave_dark
          key: wave_dark
          if: $get(enabled).value === true
          label: 底部波浪颜色（暗黑）
          value: "#fff"
    - group: carousel
      label: 首页轮播
      formSchema:
        - $formkit: switch
          name: enabled
          id: enabled
          key: enabled
          label: 首页轮播
          value: false
        - $formkit: array
          name: slides
          id: slides
          key: slides
          if: $get(enabled).value === true
          label: 轮播内容
          value: []
          itemLabels:
            - type: image
              label: $value.data_by_custom.banner_img
            - type: text
              label: $value.banner_section_type
            - type: text
              label: $value.data_by_custom.banner_title
          children:
            - $formkit: select
              name: source
              id: source
              key: source
              label: 来源
              options:
                - label: 指定文章
                  value: post
                - label: 自定义
                  value: custom
