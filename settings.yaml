apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-joe-next-setting
spec:
  forms:
    - group: general
      label: 基础
      formSchema:
        - $formkit: select
          name: color_mode
          id: color_mode
          key: color_mode
          label: 颜色模式
          value: user
          help: 用户模式：访客可在页面上切换明暗；自动模式：按下方时间段切换；浅色 / 暗黑：固定不变
          options:
            - value: user
              label: 访客切换
            - value: auto
              label: 按时段自动
            - value: light
              label: 始终浅色
            - value: dark
              label: 始终暗黑
        - $formkit: text
          name: light_hours
          id: light_hours
          key: light_hours
          label: 浅色时段
          value: 5:00~19:00
          help: 仅自动模式生效，格式 5:00~19:00，时段外为暗黑模式
        - $formkit: number
          name: content_width
          id: content_width
          key: content_width
          label: 内容最大宽度
          value: 1320
          help: 单位 px，默认 1320
        - $formkit: attachment
          name: favicon
          id: favicon
          key: favicon
          label: 网站图标
          value: ""
          help: 覆盖 Halo 的站点图标，建议 64×64 的 png
        - $formkit: toggle
          name: link_target
          id: link_target
          key: link_target
          label: 链接打开方式
          value: default
          help: 默认：文章正文和瞬间里的链接在新标签打开；当前页 / 新标签：内容区域（不含导航栏与页脚）的所有链接统一按此打开
          options:
            - value: default
              label: 默认
            - value: current
              label: 当前页
            - value: new
              label: 新标签
    - group: appearance
      label: 外观
      formSchema:
        - $el: div
          attrs:
            style: "margin-top: 4px; padding: 12px 14px; border: 0; border-radius: 8px; background: rgb(148 163 184 / 9%);"
          children:
            - $el: div
              attrs:
                style: "display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; line-height: 20px; color: rgb(15 23 42);"
              children:
                - $el: span
                  attrs:
                    style: "flex: none; width: 4px; height: 14px; border-radius: 2px; background: #fb6c28;"
                - 颜色
            - $el: div
              attrs:
                style: "margin: 2px 0 0 12px; font-size: 12px; line-height: 18px; color: rgb(100 116 139);"
              children: 主题色与滚动条
        - $formkit: color
          name: accent_light
          id: accent_light
          key: accent_light
          label: 主题色（浅色）
          value: "#fb6c28"
          help: "默认 #fb6c28"
        - $formkit: color
          name: accent_dark
          id: accent_dark
          key: accent_dark
          label: 主题色（暗黑）
          value: "#9999ff"
          help: "默认 #9999ff"
        - $formkit: color
          name: scrollbar_color
          id: scrollbar_color
          key: scrollbar_color
          label: 滚动条颜色
          value: ""
          help: "留空时浅色模式为 #c0c4cc、暗黑模式为 #666"
        - $formkit: number
          name: scrollbar_width
          id: scrollbar_width
          key: scrollbar_width
          label: 滚动条宽度
          value: 8
          help: 单位 px，填 0 隐藏滚动条
          min: 0
          max: 20
        - $el: div
          attrs:
            style: "margin-top: 4px; padding: 12px 14px; border: 0; border-radius: 8px; background: rgb(148 163 184 / 9%);"
          children:
            - $el: div
              attrs:
                style: "display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; line-height: 20px; color: rgb(15 23 42);"
              children:
                - $el: span
                  attrs:
                    style: "flex: none; width: 4px; height: 14px; border-radius: 2px; background: #fb6c28;"
                - 背景与字体
            - $el: div
              attrs:
                style: "margin: 2px 0 0 12px; font-size: 12px; line-height: 18px; color: rgb(100 116 139);"
              children: 背景图、自定义字体与灰色模式
        - $formkit: attachment
          name: background_light
          id: background_light
          key: background_light
          label: 浅色背景图
          help: 填写后浅色模式使用这张背景图，留空使用默认背景色；建议 webp 格式
          value: ""
        - $formkit: attachment
          name: background_dark
          id: background_dark
          key: background_dark
          label: 暗黑背景图
          help: 填写后暗黑模式使用这张背景图，留空使用默认背景色
          value: ""
        - $formkit: attachment
          name: custom_font
          id: custom_font
          key: custom_font
          label: 自定义字体
          value: ""
          help: 字体文件地址，建议 woff2；留空使用系统字体
        - $formkit: switch
          name: grayscale
          id: grayscale
          key: grayscale
          label: 全站灰色
          value: false
          help: 用于哀悼日等场景
    - group: navbar
      label: 导航
      formSchema:
        - $el: div
          attrs:
            style: "margin-top: 4px; padding: 12px 14px; border: 0; border-radius: 8px; background: rgb(148 163 184 / 9%);"
          children:
            - $el: div
              attrs:
                style: "display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; line-height: 20px; color: rgb(15 23 42);"
              children:
                - $el: span
                  attrs:
                    style: "flex: none; width: 4px; height: 14px; border-radius: 2px; background: #fb6c28;"
                - 通用
            - $el: div
              attrs:
                style: "margin: 2px 0 0 12px; font-size: 12px; line-height: 18px; color: rgb(100 116 139);"
              children: 导航样式、菜单与 Logo
        - $formkit: toggle
          name: style
          id: style
          key: style
          label: 导航样式
          value: islands
          help: 阅读条：页面顶部时透明，滚动后是一整条玻璃条，底边显示阅读进度；文章页向下阅读时中间显示当前章节，点击可展开目录跳转。经典：Joe 原来的通栏导航
          options:
            - value: islands
              label: 阅读条
            - value: classic
              label: 经典
        - $formkit: menuSelect
          name: menu
          id: menu
          key: menu
          label: 导航菜单
          value: ""
          help: 留空使用 Halo 的主菜单
        - $formkit: switch
          name: logo
          id: logo
          key: logo
          label: 显示 Logo
          help: 使用 Halo 站点设置中的 Logo
          value: false
        - $formkit: text
          name: logo_link
          id: logo_link
          key: logo_link
          label: Logo 链接
          value: ""
          help: "留空回到首页，填 # 不跳转"
        - $formkit: number
          name: logo_radius
          id: logo_radius
          key: logo_radius
          label: Logo 圆角
          value: 4
          help: 单位 px
          min: 0
          max: 40
        - $formkit: switch
          name: icons
          id: icons
          key: icons
          label: 菜单图标
          help: 显示菜单项在后台配置的图标
          value: false
        - $formkit: switch
          name: login
          id: login
          key: login
          label: 登录入口
          value: false
          help: 未登录显示登录按钮，已登录显示头像
        - $el: div
          attrs:
            style: "margin-top: 4px; padding: 12px 14px; border: 0; border-radius: 8px; background: rgb(148 163 184 / 9%);"
          children:
            - $el: div
              attrs:
                style: "display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; line-height: 20px; color: rgb(15 23 42);"
              children:
                - $el: span
                  attrs:
                    style: "flex: none; width: 4px; height: 14px; border-radius: 2px; background: #fb6c28;"
                - 经典样式
            - $el: div
              attrs:
                style: "margin: 2px 0 0 12px; font-size: 12px; line-height: 18px; color: rgb(100 116 139);"
              children: 仅在导航样式选择「经典」时生效
        - $formkit: switch
          name: sticky
          id: sticky
          key: sticky
          label: 吸顶
          help: 向上滚动时显示导航栏；移动端始终吸顶
          value: false
          if: $get(style).value === 'classic'
        - $formkit: switch
          name: glass
          id: glass
          key: glass
          label: 毛玻璃背景
          help: 仅吸顶时生效
          value: false
          if: $get(style).value === 'classic' && $get(sticky).value === true
        - $formkit: switch
          name: full_width
          id: full_width
          key: full_width
          label: 通栏宽度
          help: 关闭时与内容区同宽
          value: false
          if: $get(style).value === 'classic'
        - $formkit: switch
          name: icon_animation
          id: icon_animation
          key: icon_animation
          label: 菜单图标悬停动画
          value: false
          if: $get(style).value === 'classic'
        - $formkit: switch
          name: active_glow
          id: active_glow
          key: active_glow
          label: 当前项发光
          help: 当前菜单项文字加主题色光晕
          value: false
          if: $get(style).value === 'classic'
    - group: effects
      label: 动效与特效
      formSchema:
        - $el: div
          attrs:
            style: "margin-top: 4px; padding: 12px 14px; border: 0; border-radius: 8px; background: rgb(148 163 184 / 9%);"
          children:
            - $el: div
              attrs:
                style: "display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; line-height: 20px; color: rgb(15 23 42);"
              children:
                - $el: span
                  attrs:
                    style: "flex: none; width: 4px; height: 14px; border-radius: 2px; background: #fb6c28;"
                - 页面与滚动
            - $el: div
              attrs:
                style: "margin: 2px 0 0 12px; font-size: 12px; line-height: 18px; color: rgb(100 116 139);"
              children: 切页方式、入场动画、加载条与返回顶部
        - $formkit: select
          name: page_transition
          id: page_transition
          key: page_transition
          label: 页面切换方式
          value: native
          help: 原生过渡：浏览器自带的跨页面淡入淡出，仍是整页加载，最稳定（Chrome / Edge / Safari 18+ 生效，其他浏览器无影响）。无刷新切换（swup）：只替换内容区域，切换更快、页面不闪白，并预加载链接；如遇插件兼容问题可切回原生过渡。
          options:
            - value: none
              label: 关闭
            - value: native
              label: 原生过渡（推荐）
            - value: swup
              label: 无刷新切换（swup）
        - $formkit: switch
          name: swup_preload
          id: swup_preload
          key: swup_preload
          label: 预加载链接
          value: true
          if: $get(page_transition).value === 'swup'
          help: 鼠标悬停或触摸链接时提前请求页面，点击后几乎立即切换
        - $formkit: switch
          name: reveal
          id: reveal
          key: reveal
          label: 模块缓入动画
          help: 页面载入时模块依次淡入
          value: false
        - $formkit: switch
          value: false
          name: list_animation
          id: list_animation
          key: list_animation
          label: 列表入场动画
          help: 首页文章、瞬间、朋友圈、图库的列表项进入视口时播放动画
        - $formkit: select
          name: list_animation_name
          id: list_animation_name
          key: list_animation_name
          label: 入场动画效果
          value: fadeInUp
          help: 四处列表共用
          options:
            - value: fadeInUp
              label: 上浮淡入
            - value: fadeIn
              label: 淡入
            - value: fadeInDown
              label: 下落淡入
            - value: fadeInLeft
              label: 左侧滑入
            - value: fadeInRight
              label: 右侧滑入
            - value: zoomIn
              label: 缩放淡入
            - value: blurIn
              label: 模糊渐显
            - value: flipInX
              label: 翻转
            - value: bounceIn
              label: 弹出
          if: $get(list_animation).value === true
        - $formkit: switch
          value: false
          name: loading_bar
          id: loading_bar
          key: loading_bar
          label: 页面加载条
          help: 页面顶部的加载进度条
        - $formkit: number
          if: $get(loading_bar).value
          name: loading_bar_height
          id: loading_bar_height
          key: loading_bar_height
          label: 加载条高度
          value: 3
          help: 单位 px
          min: 1
          max: 10
        - $formkit: color
          if: $get(loading_bar).value
          name: loading_bar_color
          id: loading_bar_color
          key: loading_bar_color
          label: 加载条颜色
          value: ""
          help: 留空跟随主题色
        - $formkit: switch
          name: back_to_top
          id: back_to_top
          key: back_to_top
          label: 返回顶部按钮
          value: false
        - $formkit: switch
          name: back_to_top_smooth
          id: back_to_top_smooth
          key: back_to_top_smooth
          label: 平滑滚动到顶部
          value: false
          if: $get(back_to_top).value === true
        - $el: div
          attrs:
            style: "margin-top: 4px; padding: 12px 14px; border: 0; border-radius: 8px; background: rgb(148 163 184 / 9%);"
          children:
            - $el: div
              attrs:
                style: "display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; line-height: 20px; color: rgb(15 23 42);"
              children:
                - $el: span
                  attrs:
                    style: "flex: none; width: 4px; height: 14px; border-radius: 2px; background: #fb6c28;"
                - 趣味特效
            - $el: div
              attrs:
                style: "margin: 2px 0 0 12px; font-size: 12px; line-height: 18px; color: rgb(100 116 139);"
              children: 鼠标、背景、右键菜单与标签页标题
        - $formkit: select
          name: cursor_skin
          id: cursor_skin
          key: cursor_skin
          label: 鼠标皮肤
          value: "off"
          help: 部分皮肤在暗黑模式下不明显；绿色模式下不生效
          options:
            - value: "off"
              label: 无
            - value: simple_cursor
              label: 简洁卡通
            - value: simple_cursor_blue
              label: 简洁卡通-蓝
            - value: simple_sunset_light
              label: 简单日落(浅色)
            - value: simple_sunset_dark
              label: 简单日落(暗黑)
            - value: crystallize
              label: 简约水晶
            - value: emoji_zip
              label: 魔力表情
            - value: black_cat
              label: 小黑猫
        - $formkit: select
          name: cursor_effect
          id: cursor_effect
          key: cursor_effect
          label: 鼠标点击特效
          value: "off"
          help: 移动端与绿色模式下不生效
          options:
            - value: "off"
              label: 无（默认）
            - value: cursor0
              label: 樱花+颜文字
            - value: cursor1
              label: 小粒子
            - value: cursor2
              label: 大粒子
            - value: cursor3
              label: 社会主义价值观
            - value: cursor4
              label: 大爱心
            - value: cursor5
              label: 小爱心+颜文字
            - value: cursor6
              label: 多彩星星（移动）
            - value: cursor7
              label: 光标残影（移动）
            - value: cursor8
              label: 弹性表情（移动）
            - value: cursor9
              label: 表情雨（移动）
            - value: cursor10
              label: 上升气泡（移动）
            - value: cursor11
              label: 雪花雨（移动）
        - $formkit: select
          name: backdrop
          id: backdrop
          key: backdrop
          label: 背景特效
          value: "off"
          help: 部分特效显示在页面最上层，部分仅在暗黑模式生效；较耗性能，移动端与绿色模式下不加载
          options:
            - value: "off"
              label: 无
            - value: universe
              label: 宇宙空间（仅暗黑）
            - value: rain
              label: 粒子雨（顶层+仅暗黑）
            - value: plexus
              label: 自动吸附的线段
            - value: petals
              label: 飘落的花瓣（顶层）
            - value: rainbow
              label: 四色彩虹
            - value: silk
              label: 变化的彩带
            - value: silk_static
              label: 固定的彩带
            - value: balloon
              label: 上升的气球
        - $formkit: switch
          name: context_menu
          id: context_menu
          key: context_menu
          label: 自定义右键菜单
          value: false
          help: 右键时显示主题菜单：链接可新窗口打开 / 复制，图片可打开 / 复制地址，选中文字可复制 / 站内搜索，空白处可后退、刷新、回到顶部、切换明暗。按住 Ctrl / ⌘ 右键或在输入框中仍是浏览器原生菜单；移动端不启用
        - $formkit: switch
          value: false
          name: offscreen_title
          id: offscreen_title
          key: offscreen_title
          label: 离开页面时修改标题
          help: 仅首页生效
        - $formkit: text
          name: offscreen_title_leave
          id: offscreen_title_leave
          key: offscreen_title_leave
          if: $get(offscreen_title).value
          label: 离开时的标题
          value: 歪，你去哪里了？
        - $formkit: text
          name: offscreen_title_back
          id: offscreen_title_back
          key: offscreen_title_back
          if: $get(offscreen_title).value
          label: 回来时的标题
          value: (つェ⊂)咦，又回来了!
    - group: home
      label: 首页
      formSchema:
        - $el: div
          attrs:
            style: "margin-top: 4px; padding: 12px 14px; border: 0; border-radius: 8px; background: rgb(148 163 184 / 9%);"
          children:
            - $el: div
              attrs:
                style: "display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; line-height: 20px; color: rgb(15 23 42);"
              children:
                - $el: span
                  attrs:
                    style: "flex: none; width: 4px; height: 14px; border-radius: 2px; background: #fb6c28;"
                - 首页大图
            - $el: div
              attrs:
                style: "margin: 2px 0 0 12px; font-size: 12px; line-height: 18px; color: rgb(100 116 139);"
              children: 首屏的大图或视频、标题与一言
        - $formkit: switch
          value: false
          name: hero
          id: hero
          key: hero
          label: 首页大图
          help: 首页顶部全宽的大图区域
        - $formkit: text
          name: hero_title
          id: hero_title
          key: hero_title
          if: $get(hero).value === true
          label: 标题
          value: null
          help: 留空使用站点标题
        - $formkit: text
          name: hero_image
          id: hero_image
          key: hero_image
          if: $get(hero).value === true
          label: 图片
          value: http://imgapi.xl0408.top/index.php
          help: 图片地址或随机图接口
        - $formkit: attachment
          name: hero_video
          id: hero_video
          key: hero_video
          if: $get(hero).value === true
          label: 视频背景
          value: null
          help: 填写视频地址后用视频代替图片，留空使用图片
        - $formkit: switch
          value: false
          name: hero_hitokoto
          id: hero_hitokoto
          key: hero_hitokoto
          if: $get(hero).value === true
          label: 一言
          help: 标题下方显示随机一句话
        - $formkit: color
          name: hero_wave_light
          id: hero_wave_light
          key: hero_wave_light
          if: $get(hero).value === true
          label: 底部波浪颜色（浅色）
          value: "#fff"
        - $formkit: color
          name: hero_wave_dark
          id: hero_wave_dark
          key: hero_wave_dark
          if: $get(hero).value === true
          label: 底部波浪颜色（暗黑）
          value: "#fff"
        - $el: div
          attrs:
            style: "margin-top: 4px; padding: 12px 14px; border: 0; border-radius: 8px; background: rgb(148 163 184 / 9%);"
          children:
            - $el: div
              attrs:
                style: "display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; line-height: 20px; color: rgb(15 23 42);"
              children:
                - $el: span
                  attrs:
                    style: "flex: none; width: 4px; height: 14px; border-radius: 2px; background: #fb6c28;"
                - 轮播
            - $el: div
              attrs:
                style: "margin: 2px 0 0 12px; font-size: 12px; line-height: 18px; color: rgb(100 116 139);"
              children: 大图下方的文章轮播
        - $formkit: switch
          name: carousel
          id: carousel
          key: carousel
          label: 首页轮播
          value: false
        - $formkit: array
          name: carousel_slides
          id: carousel_slides
          key: carousel_slides
          if: $get(carousel).value === true
          label: 轮播内容
          value: []
          itemLabels:
            - type: image
              label: $value.data_by_custom.banner_img
            - type: text
              label: $value.banner_section_type
            - type: text
              label: $value.data_by_custom.banner_title
          children:
            - $formkit: select
              name: source
              id: source
              key: source
              label: 来源
              options:
