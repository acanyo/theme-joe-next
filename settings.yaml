    - group: footer
      label: 页脚
      formSchema:
        - $formkit: switch
          name: enabled
          id: enabled
          key: enabled
          label: 页脚
          value: true
        - $formkit: radio
          if: $get(enabled).value == true
          name: position
          id: position
          key: position
          label: 位置
          value: none
          options:
            - value: none
              label: 默认位置
            - value: fixed
              label: 底部固定
        - $formkit: switch
          if: $get(enabled).value == true
          name: full_width
          id: full_width
          key: full_width
          label: 通栏宽度
          value: false
          options:
            - value: true
              label: 是
            - value: false
              label: 否
        - $formkit: switch
          if: $get(enabled).value == true
          name: uptime
          id: uptime
          key: uptime
          label: 运行时间
          help: 实时显示网站已运行多久
          value: false
        - $formkit: text
          if: $get(uptime).value == true
          name: since
          id: since
          key: since
          label: 起始时间
          value: 2021/11/11 06:30
          help: 格式 2021/11/11 06:30
        - $formkit: switch
          if: $get(enabled).value == true
          name: icp
          id: icp
          key: icp
          label: ICP 备案号
          value: false
        - $formkit: switch
          if: $get(enabled).value == true
          name: police
          id: police
          key: police
          label: 公安备案号
          value: false
        - $formkit: group
          name: filing
          id: filing
          key: filing
          label: 备案信息
          children:
            - $formkit: text
              name: icp
              id: icp
              key: icp
              label: ICP 备案号
              value: ""
              help: ICP 备案信息将展示在页脚中，不填不展示（示例：鄂ICP备20001234号-1）
            - $formkit: text
              name: icp_link
              id: icp_link
              key: icp_link
              label: ICP备案跳转链接
              value: https://beian.miit.gov.cn/
            - $formkit: text
              name: police
              id: police
              key: police
              label: 公网安备号
              value: ""
              help: 公网安备信息将展示在页脚中，不填不展示，也可在 “页脚” 一栏中单独关闭（示例：鄂公网安备42011102001234号）
            - $formkit: text
              name: police_link
              id: police_link
              key: police_link
              label: 公安联网备案跳转链接
              value: https://beian.mps.gov.cn/#/query/webSearch
        - $formkit: switch
          if: $get(enabled).value == true
          name: powered_by
          id: powered_by
          key: powered_by
          label: Powered by Halo
          help: 建议保留，以示对项目的支持
          value: true
        - $formkit: select
          if: $get(enabled).value == true
          name: cloud
          id: cloud
          key: cloud
          label: 云服务商标识
          value: none
          options:
            - value: none
              label: 不展示(默认)
            - value: aliyun
              label: 阿里云
            - value: tencent
              label: 腾讯云
            - value: baidu
              label: 百度云
            - value: upyun
              label: 又拍云
            - value: qiniu
              label: 七牛云
            - value: huawei
              label: 华为云
            - value: jinshan
              label: 金山云
            - value: custom
              label: 自定义
        - $formkit: text
          name: cloud_url
          id: cloud_url
          key: cloud_url
          if: $get(cloud).value === 'custom'
          label: 云服务商链接
        - $formkit: attachment
          name: cloud_logo
          id: cloud_logo
          key: cloud_logo
          if: $get(cloud).value === 'custom'
          label: 云服务商 Logo
        - $formkit: switch
          if: $get(enabled).value == true
          name: rss
          id: rss
          key: rss
          label: RSS 链接
          value: false
        - $formkit: switch
          if: $get(enabled).value == true
          name: sitemap
          id: sitemap
          key: sitemap
          label: 站点地图链接
          value: false
        - $formkit: switch
          if: $get(enabled).value == true
          name: busuanzi
          id: busuanzi
          key: busuanzi
          label: 访问统计（不蒜子）
