name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # 首屏 CSS / JS 与主题包体积预算（scripts/qa/size.ts）
      - run: pnpm qa:size
      - uses: actions/upload-artifact@v4
        with:
          name: theme-joe-next
          path: dist/*.zip
