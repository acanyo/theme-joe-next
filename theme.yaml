apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-joe-next
spec:
  displayName: Joe Next
  author:
    name: Handsome&Jevon
    website: https://www.xhhao.com
  description: 一款轻快、功能完整的 Halo 博客主题，延续 Joe 的风格，页面无刷新切换，深浅色与手机端都细致适配。
  logo: /themes/theme-joe-next/assets/logo/logo.png
  homepage: https://www.xhhao.com
  repo: https://github.com/acanyo/theme-joe-next
  issues: https://github.com/acanyo/theme-joe-next/issues
  settingName: theme-joe-next-setting
  configMapName: theme-joe-next-configMap
  version: 1.0.0
  requires: ">=2.27.0"
  license:
    - name: CC BY-NC-SA 4.0
      url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  customTemplates:
    page:
      - name: 留言板
        description: 留言板页面
        file: page_leaving.html
      - name: 友链
        description: 友情链接页面（需要链接插件）
        file: page_links.html
      - name: 朋友圈
        description: 友链博客的最新文章（需要链接插件，并在插件里开启「公开 RSS 订阅动态」）
        file: page_friends.html
