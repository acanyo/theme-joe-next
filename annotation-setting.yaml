apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: ""
    kind: MenuItem
  formSchema:
    - $formkit: "iconify"
      name: "icon"
      label: "图标"
      format: "name"
      value-only: true
      help: "主题设置中开启「菜单图标」后显示；未选择时仅显示菜单文字"

---
apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: content.halo.run
    kind: SinglePage
  formSchema:
    - $formkit: "switch"
      name: "disable_sidebar"
      label: "关闭侧边栏"
      value: "false"
      onValue: "true"
      offValue: "false"
      help: "仅关闭当前页面的侧边栏，正文自动铺满；适用于默认页面、留言板、友链和朋友圈模板"
    - $formkit: "switch"
      name: "hide_title"
      label: "隐藏页面标题"
      value: "false"
      onValue: "true"
      offValue: "false"
      help: "隐藏正文上方的标题，浏览器标题与分享信息仍保留"
    - $formkit: "switch"
      name: "hide_meta"
      label: "隐藏作者与日期"
      value: "false"
      onValue: "true"
      offValue: "false"
      help: "仅影响页面顶部的信息栏，留言与朋友圈动态中的作者信息仍显示"
    - $formkit: "select"
      name: "content_width"
      label: "正文宽度"
      value: "default"
      options:
        - label: "跟随主题"
          value: "default"
        - label: "紧凑（640px）"
          value: "narrow"
        - label: "宽版（960px）"
          value: "wide"
        - label: "铺满内容区"
          value: "full"
      help: "在可用空间内限制正文宽度；与关闭侧边栏配合可获得更宽的内容区"
    - $formkit: "switch"
      name: "transparent_background"
      label: "透明正文背景"
      value: "false"
      onValue: "true"
      offValue: "false"
      help: "去掉正文卡片的底色与阴影，适合导航、作品与自定义排版页面"

---
apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: content.halo.run
    kind: Post
  formSchema:
    - $formkit: "text"
      name: "location"
      label: "作者地区"
      value: ""
      placeholder: "例如：杭州"
      help: "作者所在城市，用于获取天气；首次点击「定位并获取」授权当前位置，也可手动填写城市名"
    - $formkit: "text"
      name: "weather"
      label: "发布时天气"
      value: ""
      help: "新文章按作者地区自动获取，随文章保存；已有记录保留，点击更新天气可重新获取"
      __raw__sectionsSchema:
        inner:
          attrs:
            class: "joe-author-weather-container"
          children:
            - $cmp: "JoeNextAuthorWeather"
              props:
                context: "$node.context"
    - $formkit: "hidden"
      name: "weather_source"
      value: ""
    - $formkit: "select"
      name: "mood"
      label: "心情"
      value: ""
      options:
        - label: "不显示"
          value: ""
        - label: "😊 开心"
          value: "开心 😊"
        - label: "🥳 兴奋"
          value: "兴奋 🥳"
        - label: "😌 平静"
          value: "平静 😌"
        - label: "☕ 惬意"
          value: "惬意 ☕"
        - label: "🎯 专注"
          value: "专注 🎯"
        - label: "🤔 思考"
          value: "思考 🤔"
        - label: "🥰 感动"
          value: "感动 🥰"
        - label: "😴 疲惫"
          value: "疲惫 😴"
        - label: "😟 焦虑"
          value: "焦虑 😟"
        - label: "😔 低落"
          value: "低落 😔"
      help: "选择写作时的心情；选「不显示」隐藏此项"
    - $formkit: "switch"
      name: "disable_sidebar"
      label: "关闭侧边栏"
      value: "false"
      onValue: "true"
      offValue: "false"
      help: "仅关闭当前文章的侧边栏，正文自动铺满"
    - $formkit: "switch"
      name: "disable_donate"
      label: "关闭打赏"
      value: "false"
      onValue: "true"
      offValue: "false"
      help: "隐藏当前文章底部和悬浮操作栏中的打赏入口"
    - $formkit: "switch"
      name: "disable_copyright"
      label: "关闭版权声明"
      value: "false"
      onValue: "true"
      offValue: "false"
      help: "隐藏当前文章正文下方的版权声明"

---
apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: core.halo.run
    kind: LinkGroup
  formSchema:
    - $formkit: "text"
      name: "link_group_sort_seq"
      label: "链接分类排序序号，数字越大越靠前，如果<=0，则按照默认排序方式进行排序"
      help: "仅选择创建时间排序时应用此序号；选择「友链插件中的顺序」时完整保留后台排列"
      value: "0"
    - $formkit: "switch"
      name: "link_group_enable_show"
      label: "是否显示"
      value: "true"
      onValue: "true"
      offValue: "false"

---
apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: core.halo.run
    kind: Link
  formSchema:
    - $formkit: "text"
      name: "link_sort_seq"
      label: "同一分类内链接排序序号，数字越大越靠前，如果<=0，则按照默认排序方式进行排序"
      help: "仅选择创建时间排序时应用此序号；选择「友链插件中的顺序」时完整保留后台排列"
      value: "0"
    - $formkit: "switch"
      name: "link_enable_show"
      label: "是否显示"
      value: "true"
      onValue: "true"
      offValue: "false"
