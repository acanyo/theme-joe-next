apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: ""
    kind: MenuItem
  formSchema:
    - $formkit: "iconify"
      name: "icon"
      label: "图标"
      format: "svg"
      value-only: true
      help: "主题设置中开启「菜单图标」后显示；未选择时显示默认图标"

---
apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: core.halo.run
    kind: LinkGroup
  formSchema:
    - $formkit: "text"
      name: "link_group_sort_seq"
      label: "链接分类排序序号，数字越大越靠前，如果<=0，则按照默认排序方式进行排序"
      value: "0"
    - $formkit: "switch"
      name: "link_group_enable_show"
      label: "是否显示"
      value: "true"
      onValue: "true"
      offValue: "false"

---
apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: core.halo.run
    kind: Link
  formSchema:
    - $formkit: "text"
      name: "link_sort_seq"
      label: "同一分类内链接排序序号，数字越大越靠前，如果<=0，则按照默认排序方式进行排序"
      value: "0"
    - $formkit: "switch"
      name: "link_enable_show"
      label: "是否显示"
      value: "true"
      onValue: "true"
      offValue: "false"
